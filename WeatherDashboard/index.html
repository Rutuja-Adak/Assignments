
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="dashboard">
        <h1>Weather Dashboard</h1>
        <p class="subtitle">Check the weather in your city</p>

        <form id="searchForm" class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                aria-label="City name"
                required
            >
            <button type="submit">Search</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <section id="weatherSection" hidden>
            <div class="current-weather">
                <h2 id="cityName"></h2>
                <p id="currentDate"></p>

                <div class="temperature-row">
                    <span id="weatherIcon">🌤️</span>
                    <h2 id="temperature">--°C</h2>
                </div>

                <p id="condition">Weather condition</p>

                <div class="weather-details">
                    <div class="detail">
                        <span>Feels like</span>
                        <strong id="feelsLike">--°C</strong>
                    </div>
                    <div class="detail">
                        <span>Humidity</span>
                        <strong id="humidity">--%</strong>
                    </div>
                    <div class="detail">
                        <span>Wind speed</span>
                        <strong id="windSpeed">-- km/h</strong>
                    </div>
                </div>

                <button type="button" id="unitToggle" class="unit-button">
                    Switch to °F
                </button>
            </div>

            <h2 class="forecast-heading">3-Day Forecast</h2>
            <div id="forecast" class="forecast-grid"></div>
        </section>

        <footer>
            Weather data provided by Open-Meteo
        </footer>
    </main>

</body>
</html>
